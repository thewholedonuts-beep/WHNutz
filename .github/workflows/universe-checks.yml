name: Universe checks

on:
  pull_request:
    paths:
      - 'beep/**'
      - '.github/workflows/universe-checks.yml'
  push:
    branches:
      - main
      - fix/consolidate-universe
    paths:
      - 'beep/**'
      - '.github/workflows/universe-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test operational tooling
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: beep/go.sum
      - run: go test ./...
